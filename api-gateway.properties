
spring.application.name=api-gateway
server.port=8690



eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.cloud.gateway.server.webflux.httpclient.connect-timeout=2000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=2000

resilience4j.circuitbreaker.instances.addressCircuitBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.addressCircuitBreaker.slidingWindowSize=3
resilience4j.circuitbreaker.instances.addressCircuitBreaker.minimumNumberOfCalls=2
resilience4j.circuitbreaker.instances.addressCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.addressCircuitBreaker.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.addressCircuitBreaker.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.addressCircuitBreaker.automaticTransitionFromOpenToHalfOpenEnabled=true

resilience4j.circuitbreaker.instances.departmentCircuitBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.departmentCircuitBreaker.slidingWindowSize=3
resilience4j.circuitbreaker.instances.departmentCircuitBreaker.minimumNumberOfCalls=2
resilience4j.circuitbreaker.instances.departmentCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.departmentCircuitBreaker.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.departmentCircuitBreaker.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.departmentCircuitBreaker.automaticTransitionFromOpenToHalfOpenEnabled=true

resilience4j.circuitbreaker.instances.employeeCircuitBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.employeeCircuitBreaker.slidingWindowSize=3
resilience4j.circuitbreaker.instances.employeeCircuitBreaker.minimumNumberOfCalls=2
resilience4j.circuitbreaker.instances.employeeCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.employeeCircuitBreaker.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.employeeCircuitBreaker.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.employeeCircuitBreaker.automaticTransitionFromOpenToHalfOpenEnabled=true

#Actuator Properties
#http://localhost:8690/actuator (show all endpoints of actuator)
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
