
spring.application.name=api-gateway
server.port=8690

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.cloud.gateway.server.webflux.routes[0].id=address-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://address-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/address/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=CircuitBreaker=name=addressCircuitBreaker,fallbackUri=forward:/fallback/address

spring.cloud.gateway.server.webflux.routes[1].id=department-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://department-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/department/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=CircuitBreaker=name=departmentCircuitBreaker,fallbackUri=forward:/fallback/department

spring.cloud.gateway.server.webflux.routes[2].id=employee-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://employee-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/employee/getAll, /api/v1/employee/get/{id}
spring.cloud.gateway.server.webflux.routes[2].filters[0]=CircuitBreaker=name=employeeCircuitBreaker,fallbackUri=forward:/fallback/employee

