
spring.application.name=api-gateway
server.port=8690



eureka.client.service-url.defaultZone=http://localhost:8761/eureka

#spring.cloud.gateway.server.webflux.httpclient.connect-timeout=2000
#spring.cloud.gateway.server.webflux.httpclient.response-timeout=2000



#Actuator Properties
#http://localhost:8690/actuator (show all endpoints of actuator)
management.endpoints.web.exposure.include=*
spring.kafka.bootstrap-servers=localhost:9092
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
#Zipkin properties
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
# Security Configuration

spring.security.oauth2.client.registration.google.client-id=${OAUTH_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${OAUTH_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.client-name=Google

#spring.security.oauth2.client.provider.google.issuer-uri=https://accounts.google.com
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://accounts.google.com

