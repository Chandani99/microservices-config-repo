
spring.application.name=api-gateway
server.port=8690



eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.cloud.gateway.server.webflux.httpclient.connect-timeout=2000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=2000

spring.cloud.gateway.server.webflux.routes[0].id=address-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://address-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/address/**

spring.cloud.gateway.server.webflux.routes[0].filters[0]=CircuitBreaker=addressCircuitBreaker
spring.cloud.gateway.server.webflux.routes[0].filters[1]=FallbackHeaders
spring.cloud.gateway.server.webflux.routes[0].metadata.circuitbreaker.fallbackUri=forward:/fallback/address

spring.cloud.gateway.server.webflux.routes[1].id=department-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://department-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/department/**

spring.cloud.gateway.server.webflux.routes[1].filters[0]=CircuitBreaker=departmentCircuitBreaker
spring.cloud.gateway.server.webflux.routes[1].filters[1]=FallbackHeaders
spring.cloud.gateway.server.webflux.routes[1].metadata.circuitbreaker.fallbackUri=forward:/fallback/department

spring.cloud.gateway.server.webflux.routes[2].id=employee-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://employee-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/employee/**

spring.cloud.gateway.server.webflux.routes[2].filters[0]=CircuitBreaker=employeeCircuitBreaker
spring.cloud.gateway.server.webflux.routes[2].filters[1]=FallbackHeaders
spring.cloud.gateway.server.webflux.routes[2].metadata.circuitbreaker.fallbackUri=forward:/fallback/employee

resilience4j.circuitbreaker.configs.addressCircuitBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.configs.addressCircuitBreaker.slidingWindowSize=3
resilience4j.circuitbreaker.configs.addressCircuitBreaker.minimumNumberOfCalls=2
resilience4j.circuitbreaker.configs.addressCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.configs.addressCircuitBreaker.waitDurationInOpenState=10s
resilience4j.circuitbreaker.configs.addressCircuitBreaker.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.configs.addressCircuitBreaker.automaticTransitionFromOpenToHalfOpenEnabled=true

resilience4j.circuitbreaker.configs.departmentCircuitBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.configs.departmentCircuitBreaker.slidingWindowSize=3
resilience4j.circuitbreaker.configs.departmentCircuitBreaker.minimumNumberOfCalls=2
resilience4j.circuitbreaker.configs.departmentCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.configs.departmentCircuitBreaker.waitDurationInOpenState=10s
resilience4j.circuitbreaker.configs.departmentCircuitBreaker.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.configs.departmentCircuitBreaker.automaticTransitionFromOpenToHalfOpenEnabled=true

resilience4j.circuitbreaker.configs.employeeCircuitBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.configs.employeeCircuitBreaker.slidingWindowSize=3
resilience4j.circuitbreaker.configs.employeeCircuitBreaker.minimumNumberOfCalls=2
resilience4j.circuitbreaker.configs.employeeCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.configs.employeeCircuitBreaker.waitDurationInOpenState=10s
resilience4j.circuitbreaker.configs.employeeCircuitBreaker.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.configs.employeeCircuitBreaker.automaticTransitionFromOpenToHalfOpenEnabled=true

#Actuator Properties
#http://localhost:8690/actuator (show all endpoints of actuator)
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
